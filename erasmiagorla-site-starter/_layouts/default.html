<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>{% if page.title != "Home" %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <div class="site-shell">
    <header class="site-header">
      <div class="identity">
        <a class="site-name" href="{{ '/' | relative_url }}">{{ site.title }}</a>
        <p class="site-subtitle">{{ site.subtitle }}</p>
      </div>
      <nav class="main-nav" aria-label="Main navigation">
        <a {% if page.url == '/' %}aria-current="page"{% endif %} href="{{ '/' | relative_url }}">Home</a>
        <a {% if page.url == '/research/' %}aria-current="page"{% endif %} href="{{ '/research/' | relative_url }}">Research</a>
        <a {% if page.url == '/publications/' %}aria-current="page"{% endif %} href="{{ '/publications/' | relative_url }}">Publications &amp; Talks</a>
        <a {% if page.url == '/cv/' %}aria-current="page"{% endif %} href="{{ '/cv/' | relative_url }}">CV</a>
        <a {% if page.url == '/contact/' %}aria-current="page"{% endif %} href="{{ '/contact/' | relative_url }}">Contact</a>
      </nav>
    </header>

    <main id="main-content" class="page-content {% if page.url == '/' %}home-content{% endif %}">
      {{ content }}
    </main>

    <footer class="site-footer">
      <span>© {{ 'now' | date: '%Y' }} {{ site.title }}</span>
      <span>Research, writing &amp; performance</span>
    </footer>
  </div>
</body>
</html>
